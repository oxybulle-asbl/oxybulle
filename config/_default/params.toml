#################### default parameters ############################
# favicon module: https://github.com/gethugothemes/hugo-modules/tree/master/images#favicon-implementation
favicon = "images/favicon.png"
# logo module: https://github.com/gethugothemes/hugo-modules/tree/master/images#logo-implementation
logo = "images/logo-light.png"
logo_darkmode = "images/logo-dark.png"
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "160px"
logo_height = "32px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "Oxybulle"
# navbar fixed to top
navbar_fixed = true
# theme-mode
theme_switcher = true
theme_default = "system" # available options [light/dark/system]
# Main Sections
mainSections = ["blog"]
# contact form action
contact_form_action = "https://airform.io/oxy@oxybulle.org" # contact form works with [https://airform.io/] or [https://formspree.io]
# copyright
copyright = "&copy; 2026 Oxybulle asbl"

# Navigation button
[navigation_button]
enable = true
label = "Nous soutenir"
link = "nous-soutenir"

# search
# search module: https://github.com/gethugothemes/hugo-modules/tree/master/search
[search]
enable = true
primary_color = "#121212"
include_sections = ["pages"]
show_image = true
show_description = true
show_tags = true
show_categories = true

# counter analytics: see https://counter.dev/setup.html
[counter]
enable = true

# seo meta data for OpenGraph / Twitter Card
# seo module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/basic-seo
[metadata]
keywords = ["Oxybulle", "soutien", "enfants", "namur", "foyers", "accueil", "jeunesse", "aide", "maisons", "province", "activités", "loisirs", "scolaire", "jeunes"]
description = "Offrir une bulle d'air à des enfants et adolescents de la province de Namur qui n'ont pas la chance de grandir en famille"
author = "Oxybulle asbl"
image = "images/oxybulle-cover-1.png"

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]

# Subscription
[subscription]
enable = true
button_label = "Envoyer"
# mailchimp subscription
mailchimp_form_action = "https://oxybulle.us7.list-manage.com/subscribe/post?u=045b00bd863f7856f99029a1a&amp;id=89e703fc1f&amp;f_id=0029d5e4f0" # replace this url with yours
mailchimp_form_name = "b_045b00bd863f7856f99029a1a_89e703fc1f"